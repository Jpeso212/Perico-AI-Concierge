name: Concierge architecture guardrails

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate concierge architecture contracts
        run: python scripts/check_concierge_architecture.py
      - name: Validate runtime tenant isolation
        run: python -m unittest discover -s tests -v
